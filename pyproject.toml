[project]
name = "xberg-pipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BB435", email = "82220279+BB435@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "sqlalchemy>=2.1.1",
    "xberg>=1.3.0",
]

[project.scripts]
xberg-pipe = "xberg_pipe:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["DTZ"]
logger-objects = ["loguru.logger"]
