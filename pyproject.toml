[project]
name = "xberg-pipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BB435", email = "82220279+BB435@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "sqlalchemy>=2.1.1",
    "xberg>=1.3.0",
]

[project.optional-dependencies]
keywords = [
    "fugashi>=1.5.2",
    "keybert>=0.9.0",
    "sentence-transformers>=3.4.1",
    "unidic-lite>=1.0.8",
]
vectors = [
    "sentence-transformers>=3.4.1",
    "sqlite-vec>=0.1.6",
]
vis = [
    "fastapi[standard]>=0.142.2",
]

all = ["xberg-pipe[keywords, vectors, vis]"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
xberg-pipe = "xberg_pipe:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["DTZ"]
logger-objects = ["loguru.logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
